version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Maintain dependencies for Android Gradle project
  - package-ecosystem: "gradle"
    directory: "/apk+ublock"
    schedule:
      interval: "weekly"
    groups:
      gradle-libraries:
        patterns:
          - "*"
    ignore:
      - dependency-name: "gradle"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "androidx.core:*"
        versions: [">= 1.16.0"]
      - dependency-name: "com.google.android.material:material"
        versions: [">= 1.13.0"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # Maintain dependencies for Windows .NET projects
  - package-ecosystem: "nuget"
    directory: "/vpn/Ubour"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/vpn/Ubour.Tests"
    schedule:
      interval: "weekly"
    groups:
      nuget-test-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
