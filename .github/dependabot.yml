version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for Android Gradle project
  - package-ecosystem: "gradle"
    directory: "/apk+ublock"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for Windows .NET projects
  - package-ecosystem: "nuget"
    directory: "/vpn/Ubour"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "nuget"
    directory: "/vpn/Ubour.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
