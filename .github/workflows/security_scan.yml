name: Security Audit & Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret & Credential Leak Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

  security-audit:
    name: Code & Configuration Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check for Unencrypted Private Keys
        run: |
          echo "Scanning repository files for private keys or certificates..."
          FOUND=0
          find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \) ! -path "*/.git/*" | while read -r file; do
            echo "::warning file=$file::Sensitive key/certificate file detected: $file"
            FOUND=1
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "Warning: Sensitive certificate files should be secured."
          else
            echo "No exposed certificate/key files found."
          fi
