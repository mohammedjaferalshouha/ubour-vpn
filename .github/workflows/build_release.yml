name: Automated Build, Test & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  android-ci:
    name: Android CI (Test, Lint & Build Release APK)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Grant Execute Permission to Gradle
        run: |
          cd "apk+ublock"
          chmod +x gradlew

      - name: Run Unit Tests & Lint
        run: |
          cd "apk+ublock"
          ./gradlew test lint --no-daemon

      - name: Build Release APK
        run: |
          cd "apk+ublock"
          ./gradlew assembleRelease --no-daemon

      - name: Prepare & Verify Release Artifacts
        run: |
          mkdir -p release_out
          APK_FILE=$(find "apk+ublock/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          cp "$APK_FILE" "release_out/Ubour-VPN-Release.apk"
          echo "Verified APK artifact size: $(wc -c < release_out/Ubour-VPN-Release.apk) bytes"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ubour-VPN-Release-APK
          path: release_out/Ubour-VPN-Release.apk
          retention-days: 30

      - name: Upload Android Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-Test-and-Lint-Reports
          path: |
            apk+ublock/app/build/reports/tests/
            apk+ublock/app/build/reports/lint-results*
          retention-days: 14

  windows-ci:
    name: Windows CI (Build, Test & Multi-Architecture Publish)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup sing-box Engine Binaries
        shell: python
        run: |
          import urllib.request, zipfile, io, os

          for arch, zip_arch in [('x86_64', 'amd64'), ('x86', '386')]:
              dest_dir = os.path.join('windows', 'src', 'Ubour', 'engine', arch)
              os.makedirs(dest_dir, exist_ok=True)
              dest_file = os.path.join(dest_dir, 'sing-box.exe')
              url = f'https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-windows-{zip_arch}.zip'
              print(f'Downloading {url}...')
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  z = zipfile.ZipFile(io.BytesIO(resp.read()))
                  for member in z.namelist():
                      if member.endswith('sing-box.exe'):
                          with open(dest_file, 'wb') as f:
                              f.write(z.read(member))
                          print(f'Extracted sing-box.exe for {arch} successfully')

      - name: Restore Dependencies
        run: |
          dotnet restore windows/src/Ubour/Ubour.csproj
          dotnet restore windows/src/Ubour.Tests/Ubour.Tests.csproj

      - name: Build Windows Client (Release)
        run: |
          dotnet build windows/src/Ubour/Ubour.csproj -c Release --no-restore

      - name: Run Windows Unit Tests
        run: |
          dotnet test windows/src/Ubour.Tests/Ubour.Tests.csproj -c Release

      - name: Publish Windows Packages
        shell: pwsh
        run: |
          mkdir -p publish/Ubour-windows-x64
          mkdir -p publish/Ubour-windows-x86
          dotnet publish windows/src/Ubour/Ubour.csproj -c Release -r win-x64 --self-contained false -o publish/Ubour-windows-x64
          dotnet publish windows/src/Ubour/Ubour.csproj -c Release -r win-x86 --self-contained false -o publish/Ubour-windows-x86

          # Package x64 Assets
          Copy-Item -Path 'windows/Ubour-windows-x64/engine' -Destination 'publish/Ubour-windows-x64/engine' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/rules' -Destination 'publish/Ubour-windows-x64/rules' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/licenses' -Destination 'publish/Ubour-windows-x64/licenses' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/wintun.dll' -Destination 'publish/Ubour-windows-x64/' -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/app.ico' -Destination 'publish/Ubour-windows-x64/' -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/README.md' -Destination 'publish/Ubour-windows-x64/' -Force
          Copy-Item -Path 'windows/Ubour-windows-x64/README.ar.md' -Destination 'publish/Ubour-windows-x64/' -Force

          # Package x86 Assets
          Copy-Item -Path 'windows/Ubour-windows-x86/engine' -Destination 'publish/Ubour-windows-x86/engine' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x86/rules' -Destination 'publish/Ubour-windows-x86/rules' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x86/licenses' -Destination 'publish/Ubour-windows-x86/licenses' -Recurse -Force
          Copy-Item -Path 'windows/Ubour-windows-x86/app.ico' -Destination 'publish/Ubour-windows-x86/' -Force
          Copy-Item -Path 'windows/Ubour-windows-x86/README.md' -Destination 'publish/Ubour-windows-x86/' -Force
          Copy-Item -Path 'windows/Ubour-windows-x86/README.ar.md' -Destination 'publish/Ubour-windows-x86/' -Force

      - name: Create Windows Release Archives
        shell: pwsh
        run: |
          mkdir -p release_out
          Compress-Archive -Path publish/Ubour-windows-x64/* -DestinationPath release_out/Ubour-windows-x64.zip -Force
          Compress-Archive -Path publish/Ubour-windows-x86/* -DestinationPath release_out/Ubour-windows-x86.zip -Force
          Get-ChildItem release_out/

      - name: Upload Windows x64 Release Archive
        uses: actions/upload-artifact@v7
        with:
          name: Ubour-Windows-x64-Release
          path: release_out/Ubour-windows-x64.zip
          retention-days: 30

      - name: Upload Windows x86 Release Archive
        uses: actions/upload-artifact@v7
        with:
          name: Ubour-Windows-x86-Release
          path: release_out/Ubour-windows-x86.zip
          retention-days: 30

  publish-release:
    name: Publish Official GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-ci, windows-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Android Release APK
        uses: actions/download-artifact@v8
        with:
          name: Ubour-VPN-Release-APK
          path: release_assets/

      - name: Download Windows x64 Release
        uses: actions/download-artifact@v8
        with:
          name: Ubour-Windows-x64-Release
          path: release_assets/

      - name: Download Windows x86 Release
        uses: actions/download-artifact@v8
        with:
          name: Ubour-Windows-x86-Release
          path: release_assets/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
