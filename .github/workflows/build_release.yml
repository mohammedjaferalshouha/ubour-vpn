name: Automated Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: |
          cd "apk+ublock"
          chmod +x gradlew

      - name: Build Release APK
        run: |
          cd "apk+ublock"
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Prepare Release Artifact
        run: |
          mkdir -p release_out
          find "apk+ublock/app/build/outputs/apk/release" -name "*.apk" -exec cp {} "release_out/Ubour-VPN-Release.apk" \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubour-VPN-Release-APK
          path: release_out/Ubour-VPN-Release.apk
          retention-days: 30
